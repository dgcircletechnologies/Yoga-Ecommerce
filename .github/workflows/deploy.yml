name: Yoga Fitness CI/CD

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

concurrency:
  group: yoga-fitness-production
  cancel-in-progress: false

jobs:
  # ============================================
  # CI - Verify Docker images build
  # ============================================
  ci:
    name: CI - Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # CD - Deploy to Hostinger VPS
  # ============================================
  deploy:
    name: CD - Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: ci

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ============================================
      # Configure SSH
      # ============================================
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_PORT" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS_HOST, VPS_USER, VPS_PORT, and VPS_SSH_KEY secrets are required."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/yoga-fitness
          chmod 600 ~/.ssh/yoga-fitness

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # ============================================
      # Deploy application
      # ============================================
      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}

          # VPS_APP_DIR can be added as a GitHub secret.
          # If not provided, /root/yoga-fitness will be used.
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

          # Application secrets
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}

          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_PORT" ]; then
            echo "VPS_HOST, VPS_USER, and VPS_PORT secrets are required."
            exit 1
          fi

          APP_DIR="${VPS_APP_DIR:-/root/yoga-fitness}"

          # ============================================
          # Validate required production secrets
          # ============================================

          missing_app_secrets=""

          for secret_name in \
            POSTGRES_PASSWORD \
            JWT_ACCESS_SECRET \
            JWT_REFRESH_SECRET \
            SMTP_HOST \
            SMTP_USER \
            SMTP_PASS \
            CLOUDINARY_CLOUD_NAME \
            CLOUDINARY_API_KEY \
            CLOUDINARY_API_SECRET
          do
            if [ -z "${!secret_name}" ]; then
              missing_app_secrets="$missing_app_secrets $secret_name"
            fi
          done

          if [ -n "$missing_app_secrets" ]; then
            echo "Missing required production secrets:$missing_app_secrets"
            exit 1
          fi

          # ============================================
          # Create source archive
          # ============================================

          echo "===== Creating source archive ====="

          tar \
            --exclude='.git' \
            --exclude='backend/node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='backend/dist' \
            --exclude='frontend/.next' \
            --exclude='frontend/node_modules' \
            -czf /tmp/yoga-fitness.source.tar.gz \
            .

          # ============================================
          # Production database configuration
          # ============================================

          POSTGRES_USER_VALUE="yoga_fitness"
          POSTGRES_DB_VALUE="yoga_fitness_db"

          POSTGRES_PASSWORD_ENCODED="$(node -e 'console.log(encodeURIComponent(process.env.POSTGRES_PASSWORD || ""))')"

          DATABASE_URL="postgresql://${POSTGRES_USER_VALUE}:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_DB_VALUE}"

          # ============================================
          # Create production .env
          # ============================================

          echo "===== Creating production environment file ====="

          {
            printf '%s\n' "POSTGRES_USER=${POSTGRES_USER_VALUE}"
            printf '%s\n' "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            printf '%s\n' "POSTGRES_DB=${POSTGRES_DB_VALUE}"
            printf '%s\n' "DATABASE_URL=${DATABASE_URL}"

            # Internal container ports
            printf '%s\n' "POSTGRES_PORT=5432"
            printf '%s\n' "BACKEND_PORT=3000"
            printf '%s\n' "FRONTEND_PORT=3000"

            # Application URLs
            printf '%s\n' "CORS_ORIGIN=${CORS_ORIGIN}"
            printf '%s\n' "APP_FRONTEND_URL=${APP_FRONTEND_URL}"

            # Frontend API configuration
            printf '%s\n' "NEXT_PUBLIC_API_BASE_URL=/api/v1"
            printf '%s\n' "API_INTERNAL_BASE_URL=http://backend:3000/api/v1"

            # JWT
            printf '%s\n' "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}"
            printf '%s\n' "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}"
            printf '%s\n' "REFRESH_TOKEN_HASH_SECRET=${JWT_REFRESH_SECRET}"
            printf '%s\n' "ONE_TIME_TOKEN_HASH_SECRET=${JWT_REFRESH_SECRET}"

            printf '%s\n' "JWT_ACCESS_EXPIRES_IN_SECONDS=900"
            printf '%s\n' "JWT_REFRESH_EXPIRES_IN_SECONDS=604800"

            # Email verification
            printf '%s\n' "EMAIL_VERIFICATION_EXPIRES_IN_MINUTES=60"

            # SMTP
            printf '%s\n' "SMTP_HOST=${SMTP_HOST}"
            printf '%s\n' "SMTP_PORT=587"
            printf '%s\n' "SMTP_USER=${SMTP_USER}"
            printf '%s\n' "SMTP_PASS=${SMTP_PASS}"
            printf '%s\n' "SMTP_FROM="
            printf '%s\n' "SUPPORT_EMAIL="

            # Cloudinary
            printf '%s\n' "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
            printf '%s\n' "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}"
            printf '%s\n' "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}"

            # Update these folders if your Yoga Fitness backend
            # uses different Cloudinary folders.
            printf '%s\n' "CLOUDINARY_PRODUCT_FOLDER=yoga-fitness/products"
            printf '%s\n' "CLOUDINARY_CATEGORY_FOLDER=yoga-fitness/categories"

            # Razorpay
            printf '%s\n' "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}"
            printf '%s\n' "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}"
            printf '%s\n' "RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}"

          } > /tmp/yoga-fitness.production.env

          # ============================================
          # Prepare application directory
          # ============================================

          echo "===== Preparing Hostinger directory ====="

          ssh \
            -i ~/.ssh/yoga-fitness \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$APP_DIR'"

          # ============================================
          # Upload source
          # ============================================

          echo "===== Uploading source archive ====="

          scp \
            -i ~/.ssh/yoga-fitness \
            -P "$VPS_PORT" \
            /tmp/yoga-fitness.source.tar.gz \
            "$VPS_USER@$VPS_HOST:$APP_DIR/source.tar.gz"

          # ============================================
          # Upload production environment
          # ============================================

          echo "===== Uploading production environment ====="

          scp \
            -i ~/.ssh/yoga-fitness \
            -P "$VPS_PORT" \
            /tmp/yoga-fitness.production.env \
            "$VPS_USER@$VPS_HOST:$APP_DIR/.env"

          # ============================================
          # Deploy on Hostinger
          # ============================================

          echo "===== Running deployment on Hostinger ====="

          ssh \
            -i ~/.ssh/yoga-fitness \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "APP_DIR='$APP_DIR' bash -s" << 'DEPLOY'

          set -e

          echo "============================================"
          echo "      YOGA FITNESS DEPLOYMENT STARTED"
          echo "============================================"

          cd "$APP_DIR"

          # ==========================================
          # Extract latest source
          # ==========================================

          echo "===== Unpacking latest source ====="

          tar -xzf source.tar.gz
          rm -f source.tar.gz

          # ==========================================
          # Validate Docker Compose
          # ==========================================

          echo "===== Validating Docker Compose ====="

          docker compose -f docker-compose.prod.yml config -q

          # ==========================================
          # Build images
          # ==========================================

          echo "===== Building Docker images ====="

          docker compose \
            -f docker-compose.prod.yml \
            build

          # ==========================================
          # Start / recreate containers
          # ==========================================

          echo "===== Starting containers ====="

          docker compose \
            -f docker-compose.prod.yml \
            up -d \
            --remove-orphans

          # ==========================================
          # Show running containers
          # ==========================================

          echo "===== Running containers ====="

          docker compose \
            -f docker-compose.prod.yml \
            ps

          # ==========================================
          # Clean dangling Docker images
          # ==========================================

          echo "===== Cleaning dangling images ====="

          docker image prune -f

          echo "============================================"
          echo "      DEPLOYMENT SUCCESSFUL"
          echo "============================================"

          DEPLOY
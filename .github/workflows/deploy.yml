name: Yoga Fitness CI/CD

on:
  push:
    branches:
      - '*'

  pull_request:
    branches:
      - main

concurrency:
  group: yoga-fitness-production
  cancel-in-progress: false


jobs:

  # ============================================================
  # CI - Build Docker Images
  # ============================================================
  ci:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Backend
      # --------------------------------------------------------
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          build-args: |
            DATABASE_URL=postgresql://ci_user:ci_password@localhost:5432/ci_database
            BACKEND_INTERNAL_PORT=4000
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # --------------------------------------------------------
      # Frontend
      # --------------------------------------------------------
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          build-args: |
            FRONTEND_INTERNAL_PORT=3000
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # CD - Deploy to Hostinger
  # ============================================================
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest

    needs:
      - ci

    # Deploy ONLY when main branch receives a push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # --------------------------------------------------------
      # Validate required deployment secrets
      # --------------------------------------------------------
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}

          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
          FRONTEND_INTERNAL_PORT: ${{ secrets.FRONTEND_INTERNAL_PORT }}

          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          BACKEND_INTERNAL_PORT: ${{ secrets.BACKEND_INTERNAL_PORT }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}

          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}

          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SECURE: ${{ secrets.MAIL_SECURE }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_PRODUCT_FOLDER: ${{ secrets.CLOUDINARY_PRODUCT_FOLDER }}

          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

        run: |
          set -e

          required_vars=(
            VPS_HOST
            VPS_USER
            VPS_SSH_KEY

            NEXT_PUBLIC_API_URL
            INTERNAL_API_URL

            FRONTEND_PORT
            FRONTEND_INTERNAL_PORT

            BACKEND_PORT
            BACKEND_INTERNAL_PORT
            BACKEND_HOST

            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD

            JWT_SECRET

            FRONTEND_URL
            ADMIN_URL

            MAIL_HOST
            MAIL_USER
            MAIL_PASSWORD
            MAIL_FROM_EMAIL
            ADMIN_EMAIL

            RAZORPAY_KEY_ID
            RAZORPAY_KEY_SECRET
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Required secret '$var' is missing."
              exit 1
            fi
          done

          echo "All required deployment secrets are present."


      # --------------------------------------------------------
      # Determine application directory
      # --------------------------------------------------------
      - name: Set application directory
        id: app_dir
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          APP_DIR="${VPS_APP_DIR:-/root/yoga-fitness}"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_OUTPUT"

          echo "Deployment directory: $APP_DIR"


      # --------------------------------------------------------
      # Create source archive
      # --------------------------------------------------------
      - name: Create deployment archive
        run: |
          set -e

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.next' \
            --exclude='*.log' \
            -czf /tmp/yoga-fitness.source.tar.gz \
            -C "$GITHUB_WORKSPACE" .


      # --------------------------------------------------------
      # Generate production environment file
      # --------------------------------------------------------
      - name: Generate production environment file
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}

          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
          FRONTEND_INTERNAL_PORT: ${{ secrets.FRONTEND_INTERNAL_PORT }}

          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          BACKEND_INTERNAL_PORT: ${{ secrets.BACKEND_INTERNAL_PORT }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}

          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}

          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SECURE: ${{ secrets.MAIL_SECURE }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_PRODUCT_FOLDER: ${{ secrets.CLOUDINARY_PRODUCT_FOLDER }}

          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

        run: |
          set -e

          cat > /tmp/yoga-fitness.production.env <<EOF
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          INTERNAL_API_URL=${INTERNAL_API_URL}

          FRONTEND_PORT=${FRONTEND_PORT}
          FRONTEND_INTERNAL_PORT=${FRONTEND_INTERNAL_PORT}

          BACKEND_PORT=${BACKEND_PORT}
          BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT}
          BACKEND_HOST=${BACKEND_HOST}

          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}

          FRONTEND_URL=${FRONTEND_URL}
          ADMIN_URL=${ADMIN_URL}

          MAIL_HOST=${MAIL_HOST}
          MAIL_PORT=${MAIL_PORT:-587}
          MAIL_SECURE=${MAIL_SECURE:-false}
          MAIL_USER=${MAIL_USER}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL}
          MAIL_FROM_NAME=${MAIL_FROM_NAME:-Yoga Fitness}
          ADMIN_EMAIL=${ADMIN_EMAIL}

          CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
          CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
          CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
          CLOUDINARY_PRODUCT_FOLDER=${CLOUDINARY_PRODUCT_FOLDER:-yoga_ecommerce}

          RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
          RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
          RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
          EOF

          chmod 600 /tmp/yoga-fitness.production.env

          echo "Production environment file generated."


      # --------------------------------------------------------
      # Prepare directory on Hostinger
      # --------------------------------------------------------
      - name: Prepare application directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ steps.app_dir.outputs.APP_DIR }}
        run: |
          set -e

          ssh \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$APP_DIR'"


      # --------------------------------------------------------
      # Upload source archive
      # --------------------------------------------------------
      - name: Upload source archive
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ steps.app_dir.outputs.APP_DIR }}
        run: |
          set -e

          scp \
            -P "${VPS_PORT:-22}" \
            /tmp/yoga-fitness.source.tar.gz \
            "$VPS_USER@$VPS_HOST:$APP_DIR/source.tar.gz"


      # --------------------------------------------------------
      # Upload production environment
      # --------------------------------------------------------
      - name: Upload production environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ steps.app_dir.outputs.APP_DIR }}
        run: |
          set -e

          scp \
            -P "${VPS_PORT:-22}" \
            /tmp/yoga-fitness.production.env \
            "$VPS_USER@$VPS_HOST:$APP_DIR/.env"


      # --------------------------------------------------------
      # Deploy on Hostinger
      # --------------------------------------------------------
      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ steps.app_dir.outputs.APP_DIR }}
        run: |
          set -e

          ssh \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd "$APP_DIR"

          echo "========================================="
          echo "Starting Yoga Fitness deployment"
          echo "========================================="


          # ----------------------------------------------------
          # Extract latest source
          # ----------------------------------------------------
          echo "Extracting source..."

          tar -xzf source.tar.gz

          rm -f source.tar.gz


          # ----------------------------------------------------
          # Verify required files
          # ----------------------------------------------------
          echo "Checking deployment files..."

          test -f docker-compose.prod.yml
          test -f frontend/Dockerfile.prod
          test -f backend/Dockerfile.prod

          echo "Required files found."


          # ----------------------------------------------------
          # Validate Docker Compose configuration
          # ----------------------------------------------------
          echo "Validating Docker Compose configuration..."

          docker compose \
            -f docker-compose.prod.yml \
            config -q

          echo "Docker Compose configuration is valid."


          # ----------------------------------------------------
          # Build production containers
          # ----------------------------------------------------
          echo "Building production containers..."

          docker compose \
            -f docker-compose.prod.yml \
            build


          # ----------------------------------------------------
          # Start containers
          # ----------------------------------------------------
          echo "Starting production containers..."

          docker compose \
            -f docker-compose.prod.yml \
            up -d --remove-orphans


          # ----------------------------------------------------
          # Show container status
          # ----------------------------------------------------
          echo "Container status:"

          docker compose \
            -f docker-compose.prod.yml \
            ps


          # ----------------------------------------------------
          # Remove dangling images
          # ----------------------------------------------------
          echo "Cleaning dangling Docker images..."

          docker image prune -f


          echo "========================================="
          echo "Yoga Fitness deployment completed"
          echo "========================================="

          REMOTE_SCRIPT
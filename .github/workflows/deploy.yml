name: Yoga Fitness CI/CD

on:
  push:
    branches:
      - '*'

  pull_request:
    branches:
      - main

concurrency:
  group: yoga-fitness-production
  cancel-in-progress: false

jobs:
  # ============================================================
  # CI - Build Docker Images
  # ============================================================
  ci:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Backend
      # --------------------------------------------------------
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          build-args: |
            DATABASE_URL=postgresql://ci_user:ci_password@localhost:${{ secrets.POSTGRES_PORT || vars.POSTGRES_PORT || '5434' }}/ci_database
            BACKEND_INTERNAL_PORT=${{ secrets.BACKEND_INTERNAL_PORT || vars.BACKEND_INTERNAL_PORT || '4000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Frontend
      # --------------------------------------------------------
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api/v1' }}
            INTERNAL_API_URL=${{ secrets.INTERNAL_API_URL || vars.INTERNAL_API_URL || 'http://backend:4000/api/v1' }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID || vars.RAZORPAY_KEY_ID }}
            FRONTEND_INTERNAL_PORT=${{ secrets.FRONTEND_INTERNAL_PORT || vars.FRONTEND_INTERNAL_PORT || '3000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # CD - Deploy to Hostinger
  # ============================================================
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest

    needs:
      - ci

    # Deploy ONLY when main branch receives a push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # Install sshpass
      # --------------------------------------------------------
      - name: Install sshpass
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y sshpass


      # --------------------------------------------------------
      # Validate required deployment secrets
      # --------------------------------------------------------
      - name: Validate deployment secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USERNAME || vars.HOSTINGER_USERNAME }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || vars.HOSTINGER_PORT }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR || vars.HOSTINGER_APP_DIR }}

          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL || vars.INTERNAL_API_URL }}

          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || vars.FRONTEND_PORT }}
          FRONTEND_INTERNAL_PORT: ${{ secrets.FRONTEND_INTERNAL_PORT || vars.FRONTEND_INTERNAL_PORT }}

          BACKEND_PORT: ${{ secrets.BACKEND_PORT || vars.BACKEND_PORT }}
          BACKEND_INTERNAL_PORT: ${{ secrets.BACKEND_INTERNAL_PORT || vars.BACKEND_INTERNAL_PORT }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST || vars.BACKEND_HOST }}

          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || vars.POSTGRES_PORT || '5434' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || vars.JWT_EXPIRES_IN }}

          FRONTEND_URL: ${{ secrets.FRONTEND_URL || vars.FRONTEND_URL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL || vars.ADMIN_URL }}

          MAIL_HOST: ${{ secrets.MAIL_HOST || vars.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || vars.MAIL_PORT }}
          MAIL_SECURE: ${{ secrets.MAIL_SECURE || vars.MAIL_SECURE }}
          MAIL_USER: ${{ secrets.MAIL_USER || vars.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL || vars.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME || vars.MAIL_FROM_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || vars.ADMIN_EMAIL }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_PRODUCT_FOLDER: ${{ secrets.CLOUDINARY_PRODUCT_FOLDER || vars.CLOUDINARY_PRODUCT_FOLDER }}

          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || vars.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

        run: |
          set -e

          required_vars=(
            HOSTINGER_HOST
            HOSTINGER_USER
            HOSTINGER_PORT
            HOSTINGER_PASSWORD
            HOSTINGER_APP_DIR

            NEXT_PUBLIC_API_URL
            INTERNAL_API_URL

            FRONTEND_PORT
            FRONTEND_INTERNAL_PORT

            BACKEND_PORT
            BACKEND_INTERNAL_PORT
            BACKEND_HOST

            POSTGRES_PORT
            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD

            JWT_SECRET

            FRONTEND_URL
            ADMIN_URL

            MAIL_HOST
            MAIL_USER
            MAIL_PASSWORD
            MAIL_FROM_EMAIL
            ADMIN_EMAIL

            CLOUDINARY_CLOUD_NAME
            CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET

            RAZORPAY_KEY_ID
            RAZORPAY_KEY_SECRET
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Required secret/variable '$var' is missing."
              exit 1
            fi
          done

          echo "All required deployment secrets and variables are present (POSTGRES_PORT=${POSTGRES_PORT})."


      # --------------------------------------------------------
      # Configure SSH known_hosts
      # --------------------------------------------------------
      - name: Configure SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || vars.HOSTINGER_PORT }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p "${HOSTINGER_PORT:-22}" \
            -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

          echo "SSH host configured."


      # --------------------------------------------------------
      # Determine application directory
      # --------------------------------------------------------
      - name: Set application directory
        id: app_dir
        env:
          HOSTINGER_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR || vars.HOSTINGER_APP_DIR }}
        run: |
          set -e

          APP_DIR="${HOSTINGER_APP_DIR:-/root/yoga-fitness}"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_OUTPUT"

          echo "Deployment directory configured."


      # --------------------------------------------------------
      # Create source archive
      # --------------------------------------------------------
      - name: Create deployment archive
        run: |
          set -e

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.next' \
            --exclude='*.log' \
            -czf /tmp/yoga-fitness.source.tar.gz \
            -C "$GITHUB_WORKSPACE" .

          echo "Source archive created."


      # --------------------------------------------------------
      # Generate production environment file
      # --------------------------------------------------------
      - name: Generate production environment file
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL || vars.INTERNAL_API_URL }}

          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || vars.FRONTEND_PORT }}
          FRONTEND_INTERNAL_PORT: ${{ secrets.FRONTEND_INTERNAL_PORT || vars.FRONTEND_INTERNAL_PORT }}

          BACKEND_PORT: ${{ secrets.BACKEND_PORT || vars.BACKEND_PORT }}
          BACKEND_INTERNAL_PORT: ${{ secrets.BACKEND_INTERNAL_PORT || vars.BACKEND_INTERNAL_PORT }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST || vars.BACKEND_HOST }}

          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || vars.POSTGRES_PORT || '5434' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || vars.JWT_EXPIRES_IN }}

          FRONTEND_URL: ${{ secrets.FRONTEND_URL || vars.FRONTEND_URL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL || vars.ADMIN_URL }}

          MAIL_HOST: ${{ secrets.MAIL_HOST || vars.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || vars.MAIL_PORT }}
          MAIL_SECURE: ${{ secrets.MAIL_SECURE || vars.MAIL_SECURE }}
          MAIL_USER: ${{ secrets.MAIL_USER || vars.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL || vars.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME || vars.MAIL_FROM_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || vars.ADMIN_EMAIL }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_PRODUCT_FOLDER: ${{ secrets.CLOUDINARY_PRODUCT_FOLDER || vars.CLOUDINARY_PRODUCT_FOLDER }}

          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || vars.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

        run: |
          set -e

          POSTGRES_PORT_VALUE="${POSTGRES_PORT:-5434}"
          POSTGRES_USER_ENCODED="$(node -e 'console.log(encodeURIComponent(process.env.POSTGRES_USER || ""))')"
          POSTGRES_PASSWORD_ENCODED="$(node -e 'console.log(encodeURIComponent(process.env.POSTGRES_PASSWORD || ""))')"
          POSTGRES_DB_ENCODED="$(node -e 'console.log(encodeURIComponent(process.env.POSTGRES_DB || ""))')"
          DATABASE_URL_VALUE="postgresql://${POSTGRES_USER_ENCODED}:${POSTGRES_PASSWORD_ENCODED}@postgres:${POSTGRES_PORT_VALUE}/${POSTGRES_DB_ENCODED}"

          {
            printf '%s\n' "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            printf '%s\n' "INTERNAL_API_URL=${INTERNAL_API_URL}"
            printf '%s\n' "FRONTEND_PORT=${FRONTEND_PORT}"
            printf '%s\n' "FRONTEND_INTERNAL_PORT=${FRONTEND_INTERNAL_PORT}"
            printf '%s\n' "BACKEND_PORT=${BACKEND_PORT}"
            printf '%s\n' "BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT}"
            printf '%s\n' "BACKEND_HOST=${BACKEND_HOST}"
            printf '%s\n' "POSTGRES_PORT=${POSTGRES_PORT_VALUE}"
            printf '%s\n' "POSTGRES_DB=${POSTGRES_DB}"
            printf '%s\n' "POSTGRES_USER=${POSTGRES_USER}"
            printf '%s\n' "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            printf '%s\n' "DATABASE_URL=${DATABASE_URL_VALUE}"
            printf '%s\n' "JWT_SECRET=${JWT_SECRET}"
            printf '%s\n' "JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}"
            printf '%s\n' "FRONTEND_URL=${FRONTEND_URL}"
            printf '%s\n' "ADMIN_URL=${ADMIN_URL}"
            printf '%s\n' "MAIL_HOST=${MAIL_HOST}"
            printf '%s\n' "MAIL_PORT=${MAIL_PORT:-587}"
            printf '%s\n' "MAIL_SECURE=${MAIL_SECURE:-false}"
            printf '%s\n' "MAIL_USER=${MAIL_USER}"
            printf '%s\n' "MAIL_PASSWORD=${MAIL_PASSWORD}"
            printf '%s\n' "MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL}"
            printf '%s\n' "MAIL_FROM_NAME=${MAIL_FROM_NAME:-Yoga Fitness}"
            printf '%s\n' "ADMIN_EMAIL=${ADMIN_EMAIL}"
            printf '%s\n' "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
            printf '%s\n' "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}"
            printf '%s\n' "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}"
            printf '%s\n' "CLOUDINARY_PRODUCT_FOLDER=${CLOUDINARY_PRODUCT_FOLDER:-yoga_ecommerce}"
            printf '%s\n' "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}"
            printf '%s\n' "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}"
            printf '%s\n' "RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}"
          } > /tmp/yoga-fitness.production.env

          chmod 600 /tmp/yoga-fitness.production.env

          echo "Production environment file generated."


      # --------------------------------------------------------
      # Prepare directory on Hostinger
      # --------------------------------------------------------
      - name: Prepare application directory
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USERNAME || vars.HOSTINGER_USERNAME }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || vars.HOSTINGER_PORT }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          APP_DIR: ${{ steps.app_dir.outputs.APP_DIR }}
        run: |
          set -e

          sshpass -p "$HOSTINGER_PASSWORD" ssh \
            -o StrictHostKeyChecking=yes \
            -p "${HOSTINGER_PORT:-22}" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mkdir -p '$APP_DIR'"

          echo "Application directory prepared."


      # --------------------------------------------------------
      # Upload source archive
      # --------------------------------------------------------
      - name: Upload source archive
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USERNAME || vars.HOSTINGER_USERNAME }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || vars.HOSTINGER_PORT }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          APP_DIR: ${{ steps.app_dir.outputs.APP_DIR }}
        run: |
          set -e

          sshpass -p "$HOSTINGER_PASSWORD" scp \
            -o StrictHostKeyChecking=yes \
            -P "${HOSTINGER_PORT:-22}" \
            /tmp/yoga-fitness.source.tar.gz \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$APP_DIR/source.tar.gz"

          echo "Source archive uploaded."


      # --------------------------------------------------------
      # Upload production environment
      # --------------------------------------------------------
      - name: Upload production environment
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USERNAME || vars.HOSTINGER_USERNAME }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || vars.HOSTINGER_PORT }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          APP_DIR: ${{ steps.app_dir.outputs.APP_DIR }}
        run: |
          set -e

          sshpass -p "$HOSTINGER_PASSWORD" scp \
            -o StrictHostKeyChecking=yes \
            -P "${HOSTINGER_PORT:-22}" \
            /tmp/yoga-fitness.production.env \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$APP_DIR/.env"

          echo "Production environment uploaded."


      # --------------------------------------------------------
      # Deploy on Hostinger
      # --------------------------------------------------------
      - name: Deploy application
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USERNAME || vars.HOSTINGER_USERNAME }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || vars.HOSTINGER_PORT }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          APP_DIR: ${{ steps.app_dir.outputs.APP_DIR }}
        run: |
          set -e

          sshpass -p "$HOSTINGER_PASSWORD" ssh \
            -o StrictHostKeyChecking=yes \
            -p "${HOSTINGER_PORT:-22}" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "APP_DIR='$APP_DIR' bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd "$APP_DIR"

          echo "========================================="
          echo "Starting Yoga Fitness deployment"
          echo "========================================="


          # ----------------------------------------------------
          # Extract latest source
          # ----------------------------------------------------
          echo "Extracting source..."

          tar -xzf source.tar.gz

          rm -f source.tar.gz


          # ----------------------------------------------------
          # Verify required files
          # ----------------------------------------------------
          echo "Checking deployment files..."

          test -f docker-compose.prod.yml
          test -f frontend/Dockerfile.prod
          test -f backend/Dockerfile.prod
          test -f .env

          echo "Required files found."


          # ----------------------------------------------------
          # Validate Docker Compose configuration
          # ----------------------------------------------------
          echo "Validating Docker Compose configuration..."

          docker compose \
            -f docker-compose.prod.yml \
            config -q

          echo "Docker Compose configuration is valid."


          # ----------------------------------------------------
          # Build production containers
          # ----------------------------------------------------
          echo "Building production containers..."

          docker compose \
            -f docker-compose.prod.yml \
            build


          # ----------------------------------------------------
          # Start containers
          # ----------------------------------------------------
          echo "Starting production containers..."

          if ! docker compose -f docker-compose.prod.yml up -d --remove-orphans; then
            echo "ERROR: Containers failed to become healthy. Dumping postgres & backend logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 postgres || true
            docker compose -f docker-compose.prod.yml logs --tail=100 backend || true
            exit 1
          fi


          # ----------------------------------------------------
          # Show container status
          # ----------------------------------------------------
          echo "Container status:"

          docker compose \
            -f docker-compose.prod.yml \
            ps


          # ----------------------------------------------------
          # Remove dangling images
          # ----------------------------------------------------
          echo "Cleaning dangling Docker images..."

          docker image prune -f


          echo "========================================="
          echo "Yoga Fitness deployment completed"
          echo "========================================="

          REMOTE_SCRIPT
